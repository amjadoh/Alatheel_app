name: Publish verified Android Google release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android APK workflow run ID
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: v1.6.0
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the signed Google build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.name')" = 'Android APK'
          SOURCE_SHA="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          gh run download "$BUILD_RUN" --name Alatheel-Android-Google --dir artifact
          test -s artifact/app-release.apk
          grep -Fq '2F:50:8F:35:D3:89:AF:02:60:D7:D2:16:FB:75:0E:2E:49:EC:AE:B4:E4:FF:E5:A9:F9:28:B1:F7:A7:D6:F8:3F' artifact/signing-certificate.txt
          mv artifact/app-release.apk artifact/Alatheel-1.6.0.apk
          (cd artifact && sha256sum Alatheel-1.6.0.apk > SHA256SUMS.txt)
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifact/Alatheel-1.6.0.apk artifact/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" artifact/Alatheel-1.6.0.apk artifact/SHA256SUMS.txt \
              --verify-tag --title 'الأثيل — Android 1.6.0 · كشف حساب الخيل والتغذية حسب التكرار' \
              --notes-file docs/release-v1.6.0.md
          fi
