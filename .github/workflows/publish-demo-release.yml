name: Publish verified Android Google release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android APK workflow run ID
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: v1.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the signed Google build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.name')" = 'Android APK'
          SOURCE_SHA="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          gh run download "$BUILD_RUN" --name Alatheel-Android-Google --dir artifact
          test -s artifact/app-release.apk
          grep -Fq '87:92:04:AD:6A:7D:C3:E2:95:FA:D0:7B:FB:A3:44:B7:85:8A:70:C5' artifact/signing-certificate.txt
          mv artifact/app-release.apk artifact/Alatheel-1.2.0.apk
          (cd artifact && sha256sum Alatheel-1.2.0.apk > SHA256SUMS.txt)
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifact/Alatheel-1.2.0.apk artifact/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --title 'الأثيل — Android 1.2.0 · إدارة الملاك' \
            --notes-file docs/release-v1.2.0.md
