name: Publish verified Android Google release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android APK workflow run ID
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: v1.11.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download and verify the signed Google build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.name')" = 'Android APK'
          SOURCE_SHA="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          gh run download "$BUILD_RUN" --name Alatheel-Android-Google --dir artifact
          test -s artifact/app-release.apk
          grep -Fq '2F:50:8F:35:D3:89:AF:02:60:D7:D2:16:FB:75:0E:2E:49:EC:AE:B4:E4:FF:E5:A9:F9:28:B1:F7:A7:D6:F8:3F' artifact/signing-certificate.txt
          grep -Fiq '2f508f35d389af0260d7d216fb750e2e49ecaeb4e4ffe5a9f928b1f7a7d6f83f' artifact/apk-signature.txt
          grep -Fq "package: name='com.alatheel.stable' versionCode='17' versionName='1.11.1'" artifact/apk-identity.txt
          mv artifact/app-release.apk artifact/Alatheel-1.11.1.apk
          (cd artifact && sha256sum Alatheel-1.11.1.apk > SHA256SUMS.txt)
      - name: Prepare verified draft for device testing
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[] | select(.ref == ("refs/tags/" + env.RELEASE_TAG)) | .object.sha')"
          if test -n "$TAG_SHA"; then test "$TAG_SHA" = "$SOURCE_SHA"; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifact/Alatheel-1.11.1.apk artifact/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --draft artifact/Alatheel-1.11.1.apk artifact/SHA256SUMS.txt \
              --target "$SOURCE_SHA" --title 'الأثيل — Android 1.11.1 · تصميم واضح وخفيف والحسابات والمخزون' \
              --notes-file docs/release-v1.11.1.md
          fi
