name: Verify published APK upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-apk-upgrade.yml', 'scripts/android-upgrade-check.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator system-images;android-${{ matrix.api }};google_apis;x86_64 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Download exact released APKs and verify hashes and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous apk
          gh release download v1.7.0 -R "$GITHUB_REPOSITORY" -p Alatheel-1.7.0.apk -D previous
          gh release download v1.8.1 -R "$GITHUB_REPOSITORY" -p Alatheel-1.8.1.apk -D previous
          gh release download v1.8.2 -R "$GITHUB_REPOSITORY" -p Alatheel-1.8.2.apk -D apk
          mv apk/Alatheel-1.8.2.apk apk/app-release.apk
          printf '%s\n' '7a4704da10119300389b39fc0526810c87f9831b1eb2dd828c2a8d01a9bc33e8  previous/Alatheel-1.7.0.apk' 'cd0c43f410502c52fe3f0b69a06c0e0f36e12c5953fd9ef36cd9a29bae2e5753  previous/Alatheel-1.8.1.apk' '4cf991dc06929802e868f7c8ec3640e0e68e44fe246c0feed01ad41b80fba227  apk/app-release.apk' | sha256sum --check
          for file in previous/*.apk apk/app-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$file" > "$file.signature.txt"
            grep -Fiq '2f508f35d389af0260d7d216fb750e2e49ecaeb4e4ffe5a9f928b1f7a7d6f83f' "$file.signature.txt"
          done
      - name: Install previous releases then update without deleting application data
        env:
          ANDROID_QA_API: ${{ matrix.api }}
        run: bash scripts/android-upgrade-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alatheel-Upgrade-Android-${{ matrix.api }}
          path: android-qa/
          retention-days: 30
