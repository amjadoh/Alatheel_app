name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir functions build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/alatheel-ui" --no-save playwright@1.56.1
          "$RUNNER_TEMP/alatheel-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify mobile UI with isolated sample data
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/ui-check.cjs
      - name: Verify saved Google session continuity without production accounts
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/auth-continuity-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alatheel-Mobile-UI-QA
          path: qa-results/
          retention-days: 30
      - name: Configure the registered Firebase Android app
        run: cp resources/firebase-android.json android/app/google-services.json
      - run: pnpm exec cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify notification and inventory access rules in an isolated emulator
        env:
          QA_BACKEND_MODULES: ${{ runner.temp }}/alatheel-backend
        run: |
          npm install --prefix "$QA_BACKEND_MODULES" --no-save firebase-tools@15.33.0 @firebase/rules-unit-testing@5.0.0 firebase@12.13.0
          "$QA_BACKEND_MODULES/node_modules/.bin/firebase" emulators:exec --config firebase.qa.json --project demo-alatheel --only firestore 'node scripts/rules-check.cjs'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Restore protected signing key
        env:
          ALATHEEL_KEYSTORE_BASE64: ${{ secrets.ALATHEEL_KEYSTORE_BASE64 }}
        run: |
          test -n "$ALATHEEL_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ALATHEEL_KEYSTORE_BASE64" | base64 --decode > android/app/alatheel-release.p12
      - name: Build signed Google-only Android APK
        working-directory: android
        env:
          ALATHEEL_KEYSTORE_PASSWORD: ${{ secrets.ALATHEEL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          test -n "$ALATHEEL_KEYSTORE_PASSWORD"
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          keytool -list -keystore app/alatheel-release.p12 -storetype PKCS12 -storepass:env ALATHEEL_KEYSTORE_PASSWORD -alias alatheel > app/build/outputs/apk/release/signing-certificate.txt
      - name: Verify the built APK identity and signing certificate
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/apk-signature.txt
          grep -Fiq '2f508f35d389af0260d7d216fb750e2e49ecaeb4e4ffe5a9f928b1f7a7d6f83f' android/app/build/outputs/apk/release/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/apk-identity.txt
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_CODE="$(awk '/^[[:space:]]*versionCode / {print $2; exit}' android/app/build.gradle)"
          [[ "$EXPECTED_CODE" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "package: name='com.alatheel.stable' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_VERSION'" android/app/build/outputs/apk/release/apk-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alatheel-Android-Google
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/signing-certificate.txt
            android/app/build/outputs/apk/release/apk-signature.txt
            android/app/build/outputs/apk/release/apk-identity.txt
          retention-days: 30
  emulator:
    needs: android
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-${{ matrix.api }};google_apis;x86_64"
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: Alatheel-Android-Google
          path: apk
      - name: Download earlier releases for the signed upgrade check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download v1.7.0 -R "$GITHUB_REPOSITORY" -p Alatheel-1.7.0.apk -D previous
          gh release download v1.8.1 -R "$GITHUB_REPOSITORY" -p Alatheel-1.8.1.apk -D previous
          printf '%s\n' '7a4704da10119300389b39fc0526810c87f9831b1eb2dd828c2a8d01a9bc33e8  previous/Alatheel-1.7.0.apk' 'cd0c43f410502c52fe3f0b69a06c0e0f36e12c5953fd9ef36cd9a29bae2e5753  previous/Alatheel-1.8.1.apk' | sha256sum --check
      - name: Verify upgrade, cold startup and outdated WebView recovery
        shell: bash
        env:
          ANDROID_QA_API: ${{ matrix.api }}
        run: bash scripts/android-upgrade-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alatheel-Android-Smoke-QA-${{ matrix.api }}
          path: android-qa/
          retention-days: 30
