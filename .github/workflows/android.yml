name: Android APK
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate upgrade test generation before building
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          source = Path('scripts/android-upgrade-check.sh').read_text(encoding='utf-8')
          code = source.split("python3 - <<'PY'\n", 1)[1].split('\nPY\n', 1)[0]
          for api in ['29', '35']:
              os.environ['ANDROID_QA_API'] = api
              exec(compile(code, 'upgrade-generator', 'exec'), {})
              generated = Path('android-upgrade-generated.sh').read_text(encoding='utf-8')
              assert 'apk/app-release.apk ' + json.loads(Path('package.json').read_text())['version'] in generated
              assert generated.count('adb shell am force-stop com.alatheel.stable') == 1
              assert ("grep -Eq 'Google|" in generated) == (api == '35')
              print('PASS Android upgrade script generation: ' + api)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify private feedback export retries and attachment integrity
        run: python3 scripts/test-feedback-sync.py
      - run: pnpm build
      - run: pnpm --dir functions build
      - name: Verify notification delivery outcomes without live devices
        run: node scripts/push-delivery-check.cjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/alatheel-ui" --no-save playwright@1.56.1
          "$RUNNER_TEMP/alatheel-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify mobile UI with isolated sample data
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/ui-check.cjs
      - name: Verify purchase corrections without duplicate expenses or payments
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/purchase-correction-check.cjs
      - name: Verify Arabic mobile instructions and navigation
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/help-check.cjs
      - name: Verify FIFO feed batches and expense-only purchasing
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/feed-batches-check.cjs
      - name: Verify feedback issue status controls and retry
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/feedback-status-check.cjs
      - name: Verify saved Google session continuity without production accounts
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/auth-continuity-check.cjs
      - name: Verify startup timing and access gates with isolated delayed data
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/startup-check.cjs
      - name: Verify operational follow-up and financial projections without production records
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/follow-up-check.cjs
      - name: Verify receipt correction and feedback attachments on mobile
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/alatheel-ui
        run: node scripts/receipt-feedback-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alatheel-Mobile-UI-QA
          path: qa-results/
          retention-days: 30
      - name: Configure the registered Firebase Android app
        run: cp resources/firebase-android.json android/app/google-services.json
      - run: pnpm exec cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify notification and inventory access rules in an isolated emulator
        env:
          QA_BACKEND_MODULES: ${{ runner.temp }}/alatheel-backend
        run: |
          npm install --prefix "$QA_BACKEND_MODULES" --no-save firebase-tools@15.33.0 @firebase/rules-unit-testing@5.0.0 firebase@12.13.0
          "$QA_BACKEND_MODULES/node_modules/.bin/firebase" emulators:exec --config firebase.qa.json --project demo-alatheel --only firestore 'node scripts/backend-check.cjs'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Restore protected signing key
        env:
          ALATHEEL_KEYSTORE_BASE64: ${{ secrets.ALATHEEL_KEYSTORE_BASE64 }}
        run: |
          test -n "$ALATHEEL_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ALATHEEL_KEYSTORE_BASE64" | base64 --decode > android/app/alatheel-release.p12
      - name: Build signed Google-only Android APK
        working-directory: android
        env:
          ALATHEEL_KEYSTORE_PASSWORD: ${{ secrets.ALATHEEL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          test -n "$ALATHEEL_KEYSTORE_PASSWORD"
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          keytool -list -keystore app/alatheel-release.p12 -storetype PKCS12 -storepass:env ALATHEEL_KEYSTORE_PASSWORD -alias alatheel > app/build/outputs/apk/release/signing-certificate.txt
      - name: Verify the built APK identity and signing certificate
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee android/app/build/outputs/apk/release/apk-signature.txt
          grep -Fiq '2f508f35d389af0260d7d216fb750e2e49ecaeb4e4ffe5a9f928b1f7a7d6f83f' android/app/build/outputs/apk/release/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | tee android/app/build/outputs/apk/release/apk-identity.txt
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_CODE="$(node -e 'const f=require("fs").readFileSync("android/app/build.gradle","utf8"); const m=f.match(/\bversionCode\s+(\d+)/); if(!m)process.exit(1); process.stdout.write(m[1])')"
          [[ "$EXPECTED_CODE" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "package: name='com.alatheel.stable' versionCode='$EXPECTED_CODE' versionName='$EXPECTED_VERSION'" android/app/build/outputs/apk/release/apk-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alatheel-Android-Google
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/signing-certificate.txt
            android/app/build/outputs/apk/release/apk-signature.txt
            android/app/build/outputs/apk/release/apk-identity.txt
          retention-days: 30
  emulator:
    needs: android
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-${{ matrix.api }};google_apis;x86_64"
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: Alatheel-Android-Google
          path: apk
      - name: Download earlier releases for the signed upgrade check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          : > previous/SHA256SUMS.txt
          while read -r version sha; do
            gh release download "v$version" -R "$GITHUB_REPOSITORY" -p "Alatheel-$version.apk" -D previous
            printf '%s  previous/Alatheel-%s.apk\n' "$sha" "$version" >> previous/SHA256SUMS.txt
          done < scripts/android-upgrade-releases.txt
          sha256sum --check previous/SHA256SUMS.txt
      - name: Verify upgrade, cold startup and outdated WebView recovery
        shell: bash
        env:
          ANDROID_QA_API: ${{ matrix.api }}
        run: bash scripts/android-upgrade-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alatheel-Android-Smoke-QA-${{ matrix.api }}
          path: android-qa/
          retention-days: 30
