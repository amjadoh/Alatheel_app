name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir functions build
      - name: Configure the registered Firebase Android app
        run: cp resources/firebase-android.json android/app/google-services.json
      - run: pnpm exec cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Restore protected signing key
        env:
          ALATHEEL_KEYSTORE_BASE64: ${{ secrets.ALATHEEL_KEYSTORE_BASE64 }}
        run: |
          test -n "$ALATHEEL_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ALATHEEL_KEYSTORE_BASE64" | base64 --decode > android/app/alatheel-release.p12
      - name: Build signed Google-only Android APK
        working-directory: android
        env:
          ALATHEEL_KEYSTORE_PASSWORD: ${{ secrets.ALATHEEL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          test -n "$ALATHEEL_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon
          keytool -list -keystore app/alatheel-release.p12 -storetype PKCS12 -storepass:env ALATHEEL_KEYSTORE_PASSWORD -alias alatheel > app/build/outputs/apk/release/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alatheel-Android-Google
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/signing-certificate.txt
          retention-days: 30
